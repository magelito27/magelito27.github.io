<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerta Yape</title>
<style>
  body { font-family: sans-serif; background:#121212; color:#fff; text-align:center; padding:40px 20px; }
  h1 { color:#FF5722; }
  .code { font-size:32px; font-weight:bold; color:#4FC3F7; margin:16px 0; }
  a.btn { display:inline-block; margin-top:16px; padding:14px 28px; background:#25D366; color:#fff; border-radius:12px; text-decoration:none; font-weight:bold; }
  a.btn2 { display:inline-block; margin-top:12px; padding:14px 28px; background:#FF5722; color:#fff; border-radius:12px; text-decoration:none; font-weight:bold; }
  p { color:#bbb; }
  .links { margin-top:48px; font-size:14px; }
  .links a { color:#4FC3F7; text-decoration:none; margin:0 8px; }
  .version { color:#888; font-size:12px; margin-top:10px; }
  .version a { color:#4FC3F7; }
</style>
</head>
<body>
  <h1>📱 Alerta Yape</h1>
  <p>Alertas de voz y visuales para pagos de Yape y Plin.<br>Nunca pierdas un pago mientras atiendes tu negocio.</p>
  <div id="zonaCodigo"></div>
  <a id="btnApp" class="btn" href="guia-instalacion.html">ABRIR ALERTA YAPE</a><br>
  <a class="btn2" href="app-release.apk">📥 DESCARGAR APK v1.3.0</a>
  <p class="version">Versión 1.3.0 · APK oficial firmado por el desarrollador · <a href="guia-instalacion.html">guía de instalación</a></p>
  <p id="nota"></p>

  <p class="links">
    <a href="guia-instalacion.html">📥 Guía de instalación</a> ·
    <a href="privacidad.html">🔐 Política de Privacidad</a>
  </p>

  <script>
    var params = new URLSearchParams(window.location.search);
    var ref = params.get('ref');
    var btn = document.getElementById('btnApp');
    var esAndroid = /Android/i.test(navigator.userAgent);

    if (ref) {
      document.getElementById('zonaCodigo').innerHTML =
        '<p>Código de referido:</p>' +
        '<div class="code">' + ref + '</div>' +
        '<p>Toca el botón para abrir la app y canjearlo automáticamente (7 días gratis).</p>';
      btn.href = esAndroid
        ? 'intent://?ref=' + encodeURIComponent(ref) +
          '#Intent;action=android.intent.action.VIEW;scheme=https;package=com.alertayape.app;category=android.intent.category.DEFAULT;S.browser_fallback_url=https://magelito27.github.io/?ref=' +
          encodeURIComponent(ref) + ';end'
        : 'guia-instalacion.html';
    } else {
      document.getElementById('zonaCodigo').innerHTML =
        '<p>Instala la app y recibe alertas de voz por cada pago.</p>';
      btn.href = esAndroid
        ? 'intent://#Intent;action=android.intent.action.VIEW;scheme=https;package=com.alertayape.app;S.browser_fallback_url=https://magelito27.github.io/guia-instalacion.html;end'
        : 'guia-instalacion.html';
    }
  </script>
</body>
</html>
