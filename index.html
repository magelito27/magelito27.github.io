<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerta Yape</title>
<style>
  body { font-family: sans-serif; background:#121212; color:#fff; text-align:center; padding:40px 20px; }
  h1 { color:#FF5722; }
  .code { font-size:32px; font-weight:bold; color:#4FC3F7; margin:16px 0; }
  a.btn { display:inline-block; margin-top:24px; padding:14px 28px; background:#25D366; color:#fff; border-radius:12px; text-decoration:none; font-weight:bold; }
  p { color:#bbb; }
</style>
</head>
<body>
  <h1>📱 Alerta Yape</h1>
  <p>Alertas de voz para pagos de Yape y Plin</p>
  <div id="zonaCodigo"></div>
  <a id="btnApp" class="btn" href="#">ABRIR ALERTA YAPE</a>
  <p id="nota"></p>

  <script>
    var params = new URLSearchParams(window.location.search);
    var ref = params.get('ref');
    var btn = document.getElementById('btnApp');

    if (ref) {
      document.getElementById('zonaCodigo').innerHTML =
        '<p>Código de referido:</p>' +
        '<div class="code">' + ref + '</div>' +
        '<p>Toca el botón para abrir la app y canjearlo automáticamente (7 días gratis).</p>';
      btn.href = 'intent://?ref=' + encodeURIComponent(ref) +
        '#Intent;action=android.intent.action.VIEW;scheme=https;package=com.alertayape.app;category=android.intent.category.DEFAULT;S.browser_fallback_url=https://magelito27.github.io/?ref=' +
        encodeURIComponent(ref) + ';end';
    } else {
      document.getElementById('zonaCodigo').innerHTML =
        '<p>Instala la app y recibe alertas de voz por cada pago.</p>';
      btn.href = 'intent://#Intent;action=android.intent.action.VIEW;scheme=https;package=com.alertayape.app;S.browser_fallback_url=https://github.com/magelito27/Alerta-Yape;end';
    }
  </script>
</body>
</html>
